<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>找对象匹配仪表盘 - 高亮版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f0f2f5; }
h2, h3 { margin-top: 20px; }
input[type=range] { width: 200px; margin-right: 10px; }
#dashboard { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
.card {
  border-radius: 12px; padding: 15px; width: 250px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  transition: transform 0.3s, background 0.5s; text-align:center; color:#fff;
}
.card h4 { margin: 0 0 10px 0; }
.card .score { font-weight:bold; margin-bottom:10px; }
.slider-container { margin-bottom: 10px; color:#000; }
</style>
</head>
<body>

<h2>找对象匹配仪表盘 - 高亮版</h2>

<h3>设置偏好权重（拖动滑条调整）</h3>
<div id="sliders">
  <div class="slider-container">外貌: <span id="weight_appearance_val">3</span>
    <input type="range" min="0" max="10" value="3" id="weight_appearance" oninput="updateDashboard()">
  </div>
  <div class="slider-container">性格: <span id="weight_personality_val">5</span>
    <input type="range" min="0" max="10" value="5" id="weight_personality" oninput="updateDashboard()">
  </div>
  <div class="slider-container">兴趣: <span id="weight_interest_val">2</span>
    <input type="range" min="0" max="10" value="2" id="weight_interest" oninput="updateDashboard()">
  </div>
</div>

<h3>添加候选对象</h3>
<button onclick="addCandidate()">添加候选对象</button>

<!-- 隐藏数据表 -->
<table id="candidatesTable" style="display:none;">
  <tbody></tbody>
</table>

<h3>匹配度仪表盘</h3>
<div id="dashboard"></div>

<script>
let charts = [];

function addCandidate(name="匿名", appearance=5, personality=5, interest=5) {
  const tbody = document.querySelector("#candidatesTable tbody");
  const row = document.createElement("tr");
  row.innerHTML = `
    <td><input type="text" value="${name}" oninput="updateDashboard()"></td>
    <td><input type="number" min="1" max="10" value="${appearance}" oninput="updateDashboard()"></td>
    <td><input type="number" min="1" max="10" value="${personality}" oninput="updateDashboard()"></td>
    <td><input type="number" min="1" max="10" value="${interest}" oninput="updateDashboard()"></td>
    <td><button onclick="removeCandidate(this)">删除</button></td>
  `;
  tbody.appendChild(row);
  updateDashboard();
}

function removeCandidate(btn) { btn.closest("tr").remove(); updateDashboard(); }

function calculateResults() {
  const wAppearance = parseFloat(document.getElementById("weight_appearance").value);
  const wPersonality = parseFloat(document.getElementById("weight_personality").value);
  const wInterest = parseFloat(document.getElementById("weight_interest").value);

  document.getElementById("weight_appearance_val").innerText = wAppearance;
  document.getElementById("weight_personality_val").innerText = wPersonality;
  document.getElementById("weight_interest_val").innerText = wInterest;

  const rows = document.querySelectorAll("#candidatesTable tbody tr");
  const results = [];

  rows.forEach(row => {
    const name = row.cells[0].querySelector("input").value || "匿名";
    const appearance = parseFloat(row.cells[1].querySelector("input").value);
    const personality = parseFloat(row.cells[2].querySelector("input").value);
    const interest = parseFloat(row.cells[3].querySelector("input").value);
    const score = appearance*wAppearance + personality*wPersonality + interest*wInterest;
    results.push({name, score, appearance, personality, interest});
  });

  results.sort((a,b)=>b.score-a.score);
  return results;
}

// 将匹配度映射到颜色（红→黄→绿）
function scoreToColor(score, maxScore) {
  const hue = Math.min(Math.max((score/maxScore)*120, 0), 120); // 0=红,120=绿
  return `hsl(${hue}, 70%, 50%)`;
}

function updateDashboard() {
  const results = calculateResults();
  const dashboard = document.getElementById("dashboard");
  dashboard.innerHTML = "";
  charts.forEach(c => c.destroy());
  charts = [];

  const maxScore = results.length>0 ? results[0].score : 1;

  results.forEach(r => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.background = scoreToColor(r.score, maxScore);
    card.innerHTML = `
      <h4>${r.name}</h4>
      <div class="score">匹配度: ${r.score.toFixed(1)}</div>
      <canvas></canvas>
    `;
    dashboard.appendChild(card);

    const ctx = card.querySelector("canvas").getContext("2d");

    // 柱状图颜色随分数变化
    const dataColors = [r.appearance, r.personality, r.interest].map(val => {
      const hue = Math.min(Math.max(val*12,0),120); // val 1-10映射 12-120度
      return `hsl(${hue}, 70%, 60%)`;
    });

    const chart = new Chart(ctx, {
      type:'bar',
      data:{
        labels:['外貌','性格','兴趣'],
        datasets:[{
          label:'贡献分',
          data:[r.appearance*rAppearanceWeight(), r.personality*rPersonalityWeight(), r.interest*rInterestWeight()],
          backgroundColor: dataColors
        }]
      },
      options:{
        responsive:true,
        plugins:{ legend:{display:false} },
        scales:{ y:{beginAtZero:true, max:100} }
      }
    });
    charts.push(chart);
  });
}

function rAppearanceWeight() { return parseFloat(document.getElementById("weight_appearance").value); }
function rPersonalityWeight() { return parseFloat(document.getElementById("weight_personality").value); }
function rInterestWeight() { return parseFloat(document.getElementById("weight_interest").value); }

// 初始化示例
addCandidate("小红", 8, 7, 6);
addCandidate("小明", 5, 9, 8);
addCandidate("小丽", 6, 5, 9);

</script>
</body>
</html>

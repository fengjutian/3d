<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>clip-path 多边形示例</title>
<style>
  .box {
    width: 320px;
    height: 200px;
    background: linear-gradient(135deg,#6dd5fa,#2980b9);
    color: white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    margin:40px;
    transition: clip-path .2s;
  }

  /* 典型“切角”/不规则矩形（百分比坐标） */
  .cut-corners {
    clip-path: polygon(5% 0, 95% 0, 100% 20%, 100% 85%, 85% 100%, 15% 100%, 0 85%, 0 20%);
  }
</style>
</head>
<body>
  <div class="box cut-corners">clip-path polygon 不规则矩形（切角）</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>找对象匹配仪表盘 - 自定义维度版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; padding:20px; background:#f0f2f5; }
h2,h3 { margin-top:20px; }
input[type=range]{ width:180px; margin-right:10px; }
#dashboard { display:flex; flex-wrap:wrap; gap:20px; margin-top:20px; }
.card { border-radius:12px; padding:15px; width:300px; box-shadow:0 4px 8px rgba(0,0,0,0.1); transition:transform 0.3s, background 0.5s; text-align:center; color:#fff;}
.card h4{ margin:0 0 10px 0; }
.card .score{ font-weight:bold; margin-bottom:10px; }
.slider-container{ margin-bottom:8px; color:#000; }
button { margin:5px 0; }
</style>
</head>
<body>

<h2>找对象匹配仪表盘 - 自定义维度版</h2>

<h3>1. 管理维度</h3>
<div>
  <input type="text" id="newDimension" placeholder="维度名称">
  <button onclick="addDimension()">添加维度</button>
</div>
<div id="sliders"></div>

<h3>2. 添加候选对象</h3>
<button onclick="addCandidate()">添加候选对象</button>

<table id="candidatesTable" style="display:none;"><tbody></tbody></table>

<h3>3. 匹配度仪表盘</h3>
<div id="dashboard"></div>

<script>
let dimensions=['外貌','性格','兴趣'];
let charts=[];

// 初始化滑条
function updateSliders(){
  const container=document.getElementById('sliders');
  container.innerHTML='';
  dimensions.forEach(dim=>{
    const div=document.createElement('div');
    div.className='slider-container';
    div.innerHTML=`${dim}: <span id="weight_${dim}_val">5</span>
      <input type="range" min="0" max="10" value="5" id="weight_${dim}" oninput="updateDashboard()"> 
      <button onclick="removeDimension('${dim}')">删除</button>`;
    container.appendChild(div);
  });
}

// 添加维度
function addDimension(){
  const val=document.getElementById('newDimension').value.trim();
  if(val && !dimensions.includes(val)){
    dimensions.push(val);
    updateSliders();
    updateCandidatesTable();
    updateDashboard();
    document.getElementById('newDimension').value='';
  }
}

// 删除维度
function removeDimension(dim){
  dimensions=dimensions.filter(d=>d!==dim);
  updateSliders();
  updateCandidatesTable();
  updateDashboard();
}

// 更新候选人表格以匹配新维度
function updateCandidatesTable(){
  const rows=document.querySelectorAll("#candidatesTable tbody tr");
  rows.forEach(row=>{
    // 删除多余维度单元格
    while(row.cells.length-1>dimensions.length){
      row.deleteCell(row.cells.length-2);
    }
    // 增加缺失维度单元格
    for(let i=row.cells.length-1;i-1<dimensions.length;i++){
      const cell=row.insertCell(i);
      cell.innerHTML=`<input type="number" min="1" max="10" value="5" oninput="updateDashboard()">`;
    }
  });
}

// 添加候选对象
function addCandidate(name="匿名"){
  const tbody=document.querySelector("#candidatesTable tbody");
  const row=document.createElement("tr");
  row.innerHTML=`<td><input type="text" value="${name}" oninput="updateDashboard()"></td>`;
  dimensions.forEach(()=>row.innerHTML+=`<td><input type="number" min="1" max="10" value="5" oninput="updateDashboard()"></td>`);
  row.innerHTML+=`<td><button onclick="removeCandidate(this)">删除</button></td>`;
  tbody.appendChild(row);
  updateDashboard();
}

function removeCandidate(btn){ btn.closest("tr").remove(); updateDashboard(); }

function calculateResults(){
  const weights={};
  dimensions.forEach(dim=>{
    const w=parseFloat(document.getElementById(`weight_${dim}`).value);
    document.getElementById(`weight_${dim}_val`).innerText=w;
    weights[dim]=w;
  });

  const rows=document.querySelectorAll("#candidatesTable tbody tr");
  const results=[];
  rows.forEach(row=>{
    const name=row.cells[0].querySelector("input").value || "匿名";
    let score=0;
    const scores={};
    dimensions.forEach((dim,i)=>{
      const val=parseFloat(row.cells[i+1].querySelector("input").value);
      scores[dim]=val;
      score+=val*weights[dim];
    });
    results.push({name,score,scores});
  });
  results.sort((a,b)=>b.score-a.score);
  return results;
}

// 匹配度颜色
function scoreToColor(score,maxScore){ const hue=Math.min(Math.max((score/maxScore)*120,0),120); return `hsl(${hue},70%,50%)`; }

function updateDashboard(){
  const results=calculateResults();
  const dashboard=document.getElementById("dashboard");
  dashboard.innerHTML='';
  charts.forEach(c=>c.destroy());
  charts=[];

  const maxScore=results.length>0? results[0].score:1;

  results.forEach(r=>{
    const card=document.createElement("div");
    card.className="card";
    card.style.background=scoreToColor(r.score,maxScore);
    card.innerHTML=`<h4>${r.name}</h4><div class="score">匹配度:${r.score.toFixed(1)}</div><canvas></canvas>`;
    dashboard.appendChild(card);

    const ctx=card.querySelector("canvas").getContext("2d");
    const dataColors=dimensions.map(dim=>{
      const val=r.scores[dim];
      const hue=Math.min(Math.max(val*12,0),120);
      return `hsl(${hue},70%,60%)`;
    });

    const chart=new Chart(ctx,{
      type:'bar',
      data:{ labels:dimensions, datasets:[{label:'贡献分', data:dimensions.map(dim=>r.scores[dim]*parseFloat(document.getElementById(`weight_${dim}`).value)), backgroundColor:dataColors }] },
      options:{ responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,max:120}} }
    });
    charts.push(chart);
  });
}

// 初始化
updateSliders();
addCandidate("小红");
addCandidate("小明");
addCandidate("小丽");
</script>
</body>
</html>

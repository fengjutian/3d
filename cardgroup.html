<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>不规则矩形布局</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f7faff;
    font-family: sans-serif;
  }

  .container {
    display: grid;
    grid-template-columns: 1fr 150px 1fr;
    grid-template-rows: 1fr 150px 1fr;
    gap: 20px;
    position: relative;
  }

  /* 中心圆 */
  .center {
    grid-column: 2;
    grid-row: 2;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at center, #fff, #c0ddff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 0 12px rgba(0,0,0,0.1);
    z-index: 10;
  }

  /* 四个方向的模块 */
  .box {
    padding: 20px;
    border-radius: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
    font-size: 14px;
    color: #222;
  }

  .top    { grid-column: 2; grid-row: 1; background: #d2e6ff; }
  .bottom { grid-column: 2; grid-row: 3; background: #dbe9ff; }
  .left   { grid-column: 1; grid-row: 2; background: #d8ebff; }
  .right  { grid-column: 3; grid-row: 2; background: #d3e3ff; }

  /* 标签样式 */
  .tag {
    padding: 4px 10px;
    border-radius: 12px;
    background: #f0f6ff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
</style>
</head>
<body>
  <div class="container">
    <div class="box top">
      <div class="tag">舌诊</div>
      <div class="tag">淡白舌</div>
      <div class="tag">苔薄</div>
      <div class="tag">苔白</div>
    </div>

    <div class="box left">
      <div class="tag">脉诊</div>
      <div class="tag">弱脉</div>
      <div class="tag">细脉</div>
      <div class="tag">虚脉</div>
    </div>

    <div class="center">心气虚</div>

    <div class="box right">
      <div class="tag">面诊</div>
      <div class="tag">面色淡白</div>
      <div class="tag">鼻色明润</div>
    </div>

    <div class="box bottom">
      <div class="tag">问诊</div>
      <div class="tag">心悸</div>
      <div class="tag">自汗</div>
      <div class="tag">乏力</div>
    </div>
  </div>
</body>
</html>

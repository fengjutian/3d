<!doctype html>
<meta charset="utf-8"/>
<title>Simple 2D SPH Demo — JavaScript Canvas</title>
<style>
  body { margin:0; background:#0b1220; color:#ddd; font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial; }
  #ui { position:fixed; left:8px; top:8px; background:rgba(0,0,0,0.45); padding:8px; border-radius:8px; }
  label{ display:block; font-size:12px; margin:6px 0 2px; color:#cfe; }
  input[type=range]{ width:180px; }
  canvas { display:block; margin:0 auto; border:1px solid rgba(255,255,255,0.04); background:linear-gradient(#0b1220,#07101a); }
  #hint { font-size:12px; color:#9bb; margin-top:6px; }
</style>

<div id="ui">
  <div><strong>Simple SPH (2D)</strong></div>
  <label>Particles: <span id="cnt">0</span></label>
  <label>Rest density <input id="restDensity" type="range" min="500" max="2000" value="1000"></label>
  <label>Stiffness (k) <input id="k" type="range" min="100" max="2000" value="200"></label>
  <label>Viscosity <input id="visc" type="range" min="0" max="100" value="30"></label>
  <label>Time step <input id="dt" type="range" min="0.5" max="4" step="0.1" value="1"></label>
  <div style="margin-top:6px">
    <button id="clear">Clear</button>
    <button id="addBlock">Add Block</button>
  </div>
  <div id="hint">Click-drag to spawn particles and push them.</div>
</div>

<canvas id="c" width=900 height=500></canvas>

<script>
/*
  Simplified SPH 2D demo
  - Brute-force neighbor search (O(n^2))
  - Kernels: poly6, spiky gradient, viscosity laplacian
  - Integrator: Symplectic Euler
  - Simple boundary handling (bounce + damping)
*/

// ==== Parameters ====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const W = canvas.width, H = canvas.height;

let restDensity = +document.getElementById('restDensity').value; // ρ0
let k = +document.getElementById('k').value; // pressure constant
let viscosity = +document.getElementById('visc').value / 100.0; // µ
let timeStepFactor = +document.getElementById('dt').value / 10.0; // dt multiplier

document.getElementById('restDensity').oninput = e=> { restDensity = +e.target.value; };
document.getElementById('k').oninput = e=> { k = +e.target.value; };
document.getElementById('visc').oninput = e=> { viscosity = +e.target.value/100.0; };
document.getElementById('dt').oninput = e=> { timeStepFactor = +e.target.value/10.0; };

document.getElementById('clear').onclick = ()=> { particles = []; updateCount(); };
document.getElementById('addBlock').onclick = ()=> { spawnBlock(W*0.2, 40, 14, 12); updateCount(); };

const gravity = { x: 0, y: 1200 }; // px/s^2 downward
const particleRadius = 3.0;      // render radius
const mass = 1.0;                // particle mass
const h = 18;                    // support radius (smoothing length)
const h2 = h*h;
const poly6Factor = 4 / (Math.PI * Math.pow(h,8)); // will be scaled for 2D style (simplified)
const spikyGradFactor = -30 / (Math.PI * Math.pow(h,5));
const viscLaplacianFactor = 40 / (Math.PI * Math.pow(h,5));

let particles = [];

// particle structure: { x,y, vx,vy, ax,ay, rho, pressure }

// ==== Utilities ====
function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx + dy*dy; }
function clamp(v,a,b){ return v<a ? a : v>b ? b : v; }
function updateCount(){ document.getElementById('cnt').innerText = particles.length; }

// ==== SPH kernels (2D-approx simplified) ====
function poly6(r2){
  if(r2 >= 0 && r2 <= h2){
    const t = (h2 - r2);
    return poly6Factor * t*t*t; // poly6 ~ (h^2 - r^2)^3
  }
  return 0;
}
function spikyGrad(r, rx, ry){
  if(r > 0 && r <= h){
    const t = (h - r);
    const coef = spikyGradFactor * t*t / r; // gradient direction multiply rx/ry
    return { gx: coef * rx, gy: coef * ry };
  }
  return { gx: 0, gy: 0 };
}
function viscLaplacian(r){
  if(r >= 0 && r <= h){
    return viscLaplacianFactor * (h - r);
  }
  return 0;
}

// ==== Simulation steps ====
function computeDensityPressure(){
  for(let i=0;i<particles.length;i++){
    const pi = particles[i];
    let rho = 0;
    for(let j=0;j<particles.length;j++){
      const pj = particles[j];
      const dx = pi.x - pj.x, dy = pi.y - pj.y;
      const r2 = dx*dx + dy*dy;
      rho += mass * poly6(r2);
    }
    pi.rho = Math.max(1, rho); // avoid zero
    pi.pressure = k * (pi.rho - restDensity);
  }
}

function computeForces(){
  for(let i=0;i<particles.length;i++){
    const pi = particles[i];
    let fx = 0, fy = 0;
    for(let j=0;j<particles.length;j++){
      if(i===j) continue;
      const pj = particles[j];
      const rx = pi.x - pj.x, ry = pi.y - pj.y;
      const r = Math.hypot(rx, ry);
      if(r > h || r<=0) continue;

      // Pressure force (spiky gradient)
      const grad = spikyGrad(r, rx, ry);
      const pressTerm = -mass * (pi.pressure + pj.pressure) / (2 * pj.rho);
      fx += pressTerm * grad.gx;
      fy += pressTerm * grad.gy;

      // Viscosity force (velocity laplacian)
      const lap = viscLaplacian(r);
      fx += viscosity * mass * (pj.vx - pi.vx) / pj.rho * lap;
      fy += viscosity * mass * (pj.vy - pi.vy) / pj.rho * lap;
    }
    // Gravity
    fx += gravity.x * pi.rho;
    fy += gravity.y * pi.rho;

    // acceleration: F / rho
    pi.ax = fx / pi.rho;
    pi.ay = fy / pi.rho;
  }
}

function integrate(dt){
  // Symplectic Euler: v += a*dt; x += v*dt
  for(let p of particles){
    p.vx += p.ax * dt;
    p.vy += p.ay * dt;

    // simple X-Y integration
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // boundary conditions with damping
    const damping = 0.5;
    if(p.x < particleRadius){ p.x = particleRadius; p.vx *= -damping; }
    if(p.x > W - particleRadius){ p.x = W - particleRadius; p.vx *= -damping; }
    if(p.y < particleRadius){ p.y = particleRadius; p.vy *= -damping; }
    if(p.y > H - particleRadius){ p.y = H - particleRadius; p.vy *= -damping; }
  }
}

// ==== Rendering ====
function render(){
  ctx.clearRect(0,0,W,H);
  // draw particles as bluish drops with slight color by pressure
  for(let p of particles){
    // color mapping pressure -> blueness
    const pr = clamp((p.pressure / 1000), -1, 3);
    const blue = Math.floor(120 + clamp(pr,0,2)*60);
    const red = Math.floor(30 + clamp(-pr,0,1)*40);
    ctx.fillStyle = `rgb(${red}, ${Math.floor(blue*0.9)}, ${blue})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, particleRadius, 0, Math.PI*2);
    ctx.fill();
  }
}

// ==== Main loop ====
let last = performance.now();
function step(now){
  const elapsed = Math.min(0.05, (now - last)/1000); // cap to avoid big dt jumps
  last = now;
  const dt = elapsed * timeStepFactor;

  // Optionally: substeps for stability
  const steps = 1;
  for(let s=0; s<steps; s++){
    computeDensityPressure();
    computeForces();
    integrate(dt);
  }

  render();
  requestAnimationFrame(step);
}

// ==== Particle spawner & interaction ====
function spawnAt(x,y, vx=0, vy=0){
  particles.push({ x, y, vx, vy, ax:0, ay:0, rho:0, pressure:0 });
}

function spawnBlock(x0, y0, cols=10, rows=6, spacing=7){
  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const jitter = (Math.random()-0.5)*0.8;
      const x = x0 + i*(particleRadius*2 + spacing) + jitter;
      const y = y0 + j*(particleRadius*2 + spacing) + jitter;
      spawnAt(x,y);
    }
  }
  updateCount();
}

// mouse interactions: click-drag to spawn and add velocity
let mouseDown = false, pmx=0, pmy=0;
canvas.addEventListener('mousedown', e=>{
  mouseDown = true;
  const r = canvas.getBoundingClientRect();
  pmx = e.clientX - r.left;
  pmy = e.clientY - r.top;
  // spawn a few on click
  for(let k=0;k<6;k++){
    spawnAt(pmx + (Math.random()-0.5)*8, pmy + (Math.random()-0.5)*8, (Math.random()-0.5)*30, (Math.random()-0.5)*30);
  }
  updateCount();
});
canvas.addEventListener('mouseup', ()=> mouseDown=false);
canvas.addEventListener('mouseleave', ()=> mouseDown=false);
canvas.addEventListener('mousemove', e=>{
  if(!mouseDown) return;
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const vx = (mx - pmx) * 30;
  const vy = (my - pmy) * 30;
  // spawn along drag path
  for(let k=0;k<3;k++){
    spawnAt(mx + (Math.random()-0.5)*6, my + (Math.random()-0.5)*6, vx*(0.1+Math.random()*0.2), vy*(0.1+Math.random()*0.2));
  }
  pmx = mx; pmy = my;
  updateCount();
});

// spawn initial block
spawnBlock(W*0.2, 30, 18, 8, 2);
updateCount();
requestAnimationFrame(step);

// ==== Notes for improvements (not in code) ====
/*
 - This demo uses brute-force neighbor search. For >2000 particles use spatial hashing / uniform grid to get O(n) neighbor search.
 - Surface tension, cohesion, and more stable pressure solvers (e.g., WCSPH with correct constant tuning) can improve look.
 - For better visuals, render metaballs (isosurface) or use particles as input to screen-space smoothing shader (WebGL).
 - To produce splashes with air interaction, add particle-to-grid coupling or boundary objects.
*/
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Three.js 模型组件显示/隐藏 Demo</title>
  <style>
    body { margin: 0; overflow: hidden; background: #202020; }
    canvas { display: block; }
    #ui {
      position: absolute; top: 20px; left: 20px;
      display: flex; flex-direction: column; gap: 10px;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <button id="toggleHat">切换帽子</button>
    <button id="toggleSword">切换剑</button>
  </div>

  <script type="module">
    // 导入Three.js库
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    console.log('Three.js已加载');
    
    let scene, camera, renderer, controls;
    let character, hat, sword;

    // 初始化场景
    function init() {
      // 创建场景
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202020);
      
      // 添加网格辅助线，帮助调试
      const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
      scene.add(gridHelper);

      // 创建摄像机
      camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(3, 3, 5);
      camera.lookAt(0, 0, 0); // 确保摄像机指向原点

      // 创建渲染器
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // 添加控制器
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // 添加更强的光照
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
      directionalLight.position.set(5, 10, 7);
      directionalLight.castShadow = true;
      scene.add(directionalLight);

      // 创建人物（用方块代替身体）
      character = new THREE.Group();
      
      // 身体
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1, 2, 0.6),
        new THREE.MeshStandardMaterial({ color: 0x44aa88, metalness: 0.1, roughness: 0.7 })
      );
      body.castShadow = true;
      character.add(body);

      // 帽子
      hat = new THREE.Mesh(
        new THREE.ConeGeometry(0.7, 0.6, 16),
        new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.2, roughness: 0.6 })
      );
      hat.position.set(0, 1.3, 0); // 放在头上
      hat.name = "Hat";
      hat.castShadow = true;
      character.add(hat);

      // 剑
      sword = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 1.2, 0.1),
        new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 })
      );
      sword.position.set(0.6, -0.2, 0); // 在右手位置
      sword.name = "Sword";
      sword.castShadow = true;
      character.add(sword);

      scene.add(character);
      console.log('角色模型已添加到场景');

      // UI 事件
      document.getElementById("toggleHat").onclick = () => {
        hat.visible = !hat.visible;
        console.log('帽子显示状态:', hat.visible);
      };
      document.getElementById("toggleSword").onclick = () => {
        sword.visible = !sword.visible;
        console.log('剑显示状态:', sword.visible);
      };

      // 窗口自适应
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // 动画循环
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // 启动应用
    init();
    animate();
    console.log('应用已启动');
  </script>
</body>
</html>
